#cloud-config

write_files:
  # cloud-init mounts runs in init, before nfs-common is installed in final.
  # Defer NFS fstab entries until runcmd (which runs after package installation).
  - path: "/usr/local/sbin/dsh-register-nfs-mounts"
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Idempotent if the cloud-init final stage is retried.
      while IFS= read -r entry; do
        if ! grep -Fqx -- "$entry" /etc/fstab; then
          printf '%s\n' "$entry" >> /etc/fstab
        fi
      done <<'DSH_NFS_FSTAB'
      {{storage_account_desired_state_name}}.blob.core.windows.net:/{{storage_account_desired_state_name}}/desiredstate /var/local/ansible nfs ro,_netdev,sec=sys,vers=3,nolock,proto=tcp 0 0
      {{storage_account_data_private_sensitive_name}}.blob.core.windows.net:/{{storage_account_data_private_sensitive_name}}/ingress /mnt/input nfs ro,_netdev,sec=sys,vers=3,nolock,proto=tcp 0 0
      {{storage_account_data_private_sensitive_name}}.blob.core.windows.net:/{{storage_account_data_private_sensitive_name}}/egress /mnt/output nfs rw,_netdev,sec=sys,vers=3,nolock,proto=tcp 0 0
      {{storage_account_data_private_user_name}}.file.core.windows.net:/{{storage_account_data_private_user_name}}/shared /mnt/shared nfs _netdev,sec=sys,nconnect=4 0 0
      {{storage_account_data_private_user_name}}.file.core.windows.net:/{{storage_account_data_private_user_name}}/home /home nfs _netdev,sec=sys,nconnect=4 0 0
      DSH_NFS_FSTAB

  - path: "/etc/systemd/system/desired-state.timer"
    permissions: "0644"
    content: |
      [Unit]
      Description=Run desired state script daily

      [Timer]
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: "/etc/systemd/system/desired-state.service"
    permissions: "0644"
    content: |
      [Unit]
      Description=Run desired state script
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStartPre=sleep 1m
      ExecStart=/root/desired_state.sh
      StandardOutput=journal+console

  - path: "/root/desired_state.sh"
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      pushd /var/local/ansible
      ansible-playbook desired_state.yaml
      popd
{{#data_disk_support}}
disk_setup:
  /dev/disk/azure/scsi1/lun0:
    table_type: gpt
    layout: true
    overwrite: true

fs_setup:
  - device: /dev/disk/azure/scsi1/lun0
    partition: "auto"
    filesystem: ext4
{{/data_disk_support}}
mounts:
  # Mount ephemeral storage at resource instead of default /mnt
  - [ephemeral0, /mnt/scratch]
  {{#data_disk_support}}
  # Mounting data disk
  - ["/dev/disk/azure/scsi1/lun0-part1", "/mnt/datadrive", auto, "defaults,nofail"]
  {{/data_disk_support}}

# Add additional apt repositories
apt:
  debconf_selections:
    msodbcsql17: msodbcsql17 msodbcsql/ACCEPT_EULA boolean true
  http_proxy: http://{{apt_proxy_server_hostname}}:8000
  https_proxy: http://{{apt_proxy_server_hostname}}:8000

# Install necessary apt packages
packages:
  - ansible
  - libnss-ldapd  # LDAP login
  - libpam-ldapd  # LDAP login
  - ldap-utils    # LDAP login
  - nfs-common    # Mounting shared volumes
package_update: true
package_upgrade: true

runcmd:
  # Mount all external volumes
  # --------------------------
  - echo ">=== Mounting all external volumes... ===<"
  - mkdir -p /var/local/ansible /mnt/input /mnt/output /mnt/shared /home
  - /usr/local/sbin/dsh-register-nfs-mounts
  - grep -v -e '^[[:space:]]*$' /etc/fstab | sed 's|^|  /etc/fstab  |'
  - mount -fav
  - while (! mountpoint -q /mnt/input); do sleep 5; mount /mnt/input; done
  - while (! mountpoint -q /var/local/ansible); do sleep 5; mount /var/local/ansible; done
  - while (! mountpoint -q /home); do sleep 5; mount /home; done
  - while (! mountpoint -q /mnt/output); do sleep 5; mount /mnt/output; done
  - while (! mountpoint -q /mnt/shared); do sleep 5; mount /mnt/shared; done
  - findmnt

  # Enable and start desired state timer
  # ------------------------------------
  - echo ">=== Enabling desired state timer... ===<"
  - systemctl daemon-reload
  - systemctl enable desired-state.timer
  - systemctl start desired-state.timer

  # Run desired state service
  # -------------------------
  - echo ">=== Waiting for Pulumi vars file... ===<"
  - while (! test -f /var/local/ansible/vars/pulumi_vars.yaml) do sleep 5; done
  - echo ">=== Running initial desired state configuration... ===<"
  - systemctl start desired-state

  # Restart services
  - systemctl restart nslcd
