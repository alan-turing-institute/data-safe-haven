---

- name: Microsoft packages repo
  tags: apt
  block:
    # This should be the preferred method, but the Ubuntu image has old Curl/OpenSSL
    # - name: Fetch Microsoft package signing key
    #   ansible.builtin.get_url:
    #     url: https://packages.microsoft.com/keys/microsoft.asc
    #     dest: /etc/apt/keyrings/microsoft.asc
    #     checksum: sha256:2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
    - name: Import Microsoft package signing key
      ansible.builtin.apt_key:
        keyserver: keyserver.ubuntu.com
        id: BC528686B50D79E339D3721CEB3E94ADBE1229CF

    - name: Add Microsoft packages source
      ansible.builtin.apt_repository:
        repo: "deb https://packages.microsoft.com/ubuntu/{{ ansible_facts.distribution_version }}/prod {{ ansible_facts.distribution_release }} main"
        state: present
        filename: microsoft-general
        update_cache: true

- name: Set apt priorities
  tags: apt
  block:
    - name: Set Microsoft repo priority
      ansible.builtin.template:
        src: etc/apt/preferences.d/microsoft-general.j2
        dest: /etc/apt/preferences.d/microsoft-general
        mode: "0644"

- name: Add Netbird repo
  tags: apt
  block:
    # - name: Fetch Netbird package signing key
    #   ansible.builtin.get_url:
    #     # Netbird provides the key in the armor format rather than binary
    #     url: https://pkgs.netbird.io/debian/public.key
    #     # .asc is used for armored keys
    #     dest: /etc/apt/keyrings/netbird.asc
    #     checksum: sha256:6bd434c07e7c3a71211de79ca287e93b45deadedc4b74f1a2e83e11abe6e0bf5
    - name: Install Netbird package signing key
      ansible.builtin.copy:
        src: etc/apt/keyrings/netbird.asc
        dest: /etc/apt/keyrings/netbird.asc
        mode: "0644"

    - name: Add Netbird package source
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main"
        state: present
        filename: netbird
        update_cache: false

- name: Apt packages
  tags: apt
  block:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

    - name: List apt packages to install
      ansible.builtin.debug:
        msg: "{{ apt_packages.common | union(apt_packages[ansible_facts.distribution_release]) }}"

    - name: Install apt packages
      ansible.builtin.apt:
        name: "{{ apt_packages.common | union(apt_packages[ansible_facts.distribution_release]) }}"
        state: present
      async: 3600
      poll: 30

- name: Install deb packages
  tags: deb
  ansible.builtin.include_tasks:
    file: tasks/install_deb.yaml
  loop: "{{ deb_packages[ansible_facts.distribution_release] }}"

- name: Install snap packages
  tags: snap
  community.general.snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic | default('false') }}"
    state: present
  loop: "{{ snap_packages }}"

# https://ubuntu.com/server/docs/nvidia-drivers-installation#installing-the-drivers-on-servers-andor-for-computing-purposes
- name: Use ubuntu-drivers to install Nvidia drivers  # noqa: no-handler
  tags: nvidia
  ansible.builtin.command:
    cmd: ubuntu-drivers install --gpgpu
    creates: /usr/bin/nvidia-smi
