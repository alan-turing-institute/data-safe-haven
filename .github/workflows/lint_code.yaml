---
name: Lint code

# Run workflow on pushes to matching branches
on: # yamllint disable-line rule:truthy
  push:
    branches: [develop, latest]
  pull_request:

jobs:
  lint_caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install caddy
        shell: bash
        env:
          CADDY_VERSION: "2.11.7"
          CADDY_SHA256: "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b"
        run: |
          # Use a pinned upstream binary; the Cloudsmith APT endpoint can be unavailable.
          install_dir="$(mktemp -d "${RUNNER_TEMP}/caddy.XXXXXX")"
          archive="${install_dir}/caddy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${CADDY_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" caddy
          chmod +x "${install_dir}/caddy"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/caddy" version
      - name: Lint Caddy
        shell: bash
        run: |
          # Check Caddyfile formatting
          find . -name Caddyfile -print0 | xargs -0 -n 1 caddy fmt > /dev/null
          # Check Caddyfile validity
          find . -name Caddyfile -print0 | xargs -0 -n 1 -I {} caddy validate --config "{}"

  lint_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install requirements
        shell: bash
        run: npm install -g jsonlint mustache
      - name: Lint JSON
        shell: bash
        run: |
          echo "{}" > mustache_config.json
          find . -name "*.json" | xargs -n 1 mustache mustache_config.json | jsonlint --quiet --compact

  lint_markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install requirements
        shell: bash
        run: gem install mdl
      - name: Lint Markdown
        run: mdl --style .mdlstyle.rb .

  lint_python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install hatch
        run: pip install virtualenv==20.39.0 hatch==1.16.3
        # Temporary workaround. virtualenv==21.0.0 breaks the GH Action.
      - name: Print package versions
        run: |
          hatch run lint:ruff --version
          hatch run lint:black --version
      - name: Lint Python
        run: hatch run lint:all

  lint_shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install requirements
        shell: bash
        run: sudo apt install shellcheck
      - name: Lint shell
        shell: bash
        run: find . -name "*.sh" | xargs shellcheck --format gcc --severity error

  lint_yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install requirements
        shell: bash
        run: |
          npm install -g mustache
      - name: Expand mustache templates
        run: .github/scripts/expand_mustache.sh
      - name: Lint YAML
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_strict: true
          yamllint_comment: false
